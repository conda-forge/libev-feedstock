{% set version = "4.33" %}

package:
  name: libev
  version: "{{ version }}"

source:
  url: http://dist.schmorp.de/libev/Attic/libev-{{ version }}.tar.gz
  sha256: 507eb7b8d1015fbec5b935f34ebed15bf346bed04a11ab82b8eee848c4205aea
  patches:
    - 0001-event.h-use-winsock2-timeval-on-win32.patch  # [win]

build:
  number: 3

requirements:
  build:
    - make  # [unix]
    - libtool  # [unix]
    - autotools_clang_conda  # [win]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:

outputs:
  - name: libev
    script: install.sh  # [unix]
    build:
      run_exports:
        - {{ pin_subpackage('libev', max_pin='x.x') }}
    test:
      commands:
        # Check for headers.
        - test -f "${PREFIX}/include/ev.h"  # [unix]
        - test -f "${PREFIX}/include/ev++.h"  # [unix]
        - test ! -f "${PREFIX}/include/event.h"  # [unix]
        - test ! -f "${PREFIX}/lib/libev.a"  # [unix]
        - test -f "${PREFIX}/lib/libev${SHLIBEXT}"  # [unix]
        - if not exist "%LIBRARY_INC%\ev.h" exit 1  # [win]
        - if not exist "%LIBRARY_INC%\ev++.h" exit 1  # [win]
        - if exist "%LIBRARY_INC%\event.h" exit 1  # [win]
        - if not exist "%LIBRARY_LIB%\ev.lib" exit 1  # [win]

  - name: libev-static
    script: install.sh  # [unix]
    build:
      skip: true  # [win]
    requirements:
      build:
        - libtool  # [unix]
        - make  # [unix]
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
      host:
        - {{ pin_subpackage('libev', exact=True) }}
      run:
        - {{ pin_subpackage('libev', exact=True) }}
    test:
      commands:
        - test ! -f "${PREFIX}/include/event.h"  # [unix]
        - test -f "${PREFIX}/lib/libev.a"  # [unix]
      host:
        - {{ pin_subpackage('libev', exact=True) }}
      run:
        - {{ pin_subpackage('libev', exact=True) }}

  # Compatibility wrapper to enable programs which use the libevent event loop to link against libev
  # Split into a separate package to prevent clobbering libevent
  - name: libev-libevent
    script: install.sh  # [unix]
    build:
      skip: true  # [win]
    requirements:
      build:
        - libtool
        - make  # [unix]
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
      host:
        - {{ pin_subpackage('libev', exact=True) }}
      run:
        - {{ pin_subpackage('libev', exact=True) }}
      run_constrained:
        - libevent ==9999999999
    test:
      commands:
        - test -f "${PREFIX}/include/event.h"


about:
  home: http://software.schmorp.de/pkg/libev.html
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A full-featured and high-performance event loop that is loosely modeled after libevent, but without its limitations and bugs.

extra:
  recipe-maintainers:
    - petercable
    - carlodri
    - wolfv
